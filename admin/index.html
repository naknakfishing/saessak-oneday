<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>새싹 공방 예약함</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Gowun+Dodum&display=swap" rel="stylesheet">
  <style>
    :root { --forest: #1E4A2C; --leaf: #5E8F3A; --sage: #CAD7A6; --shoot: #EDF1D0; --oat: #FBF7E6; --seed: #F3C24A; }
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    body { margin: 0; background: var(--oat); color: var(--forest); font: 17px/1.6 'Gowun Dodum', system-ui, sans-serif; }
    :focus-visible { outline: 3px solid var(--seed); outline-offset: 2px; }
    .wrap { width: min(720px, 100% - 2rem); margin: 0 auto; padding: 1.5rem 0 4rem; }
    h1 { font: 400 1.8rem/1.2 'Black Han Sans', sans-serif; margin: 0 0 1rem; }
    button, input { font: inherit; }
    .login { display: grid; gap: .8rem; margin-top: 2rem; }
    .login input { padding: .9rem 1rem; border: 2px solid rgba(30,74,44,.3); border-radius: 1rem; font-size: 1.1rem; background: #fff; color: var(--forest); }
    .btn { min-height: 3rem; padding: 0 1.2rem; border: 0; border-radius: 999px; background: var(--forest); color: var(--oat); font-weight: 700; cursor: pointer; }
    .err { color: #A3361F; min-height: 1.6em; margin: 0; }
    .bar { display: flex; align-items: center; justify-content: space-between; gap: 1rem; margin-bottom: 1rem; }
    .count { background: var(--forest); color: var(--oat); border-radius: 1.5rem; padding: 1.2rem 1.5rem; margin-bottom: 1.25rem; }
    .count strong { font: 400 3rem/1 'Black Han Sans', sans-serif; color: var(--seed); margin-right: .4rem; }
    .list { list-style: none; margin: 0; padding: 0; display: grid; gap: .9rem; }
    .card { background: #fff; border-radius: 1.25rem; padding: 1.1rem 1.25rem; border: 2px solid transparent; }
    .card.new { border-color: var(--seed); }
    .meta { font-size: .9rem; opacity: .7; margin: 0; }
    .name { font: 400 1.35rem/1.3 'Black Han Sans', sans-serif; margin: .2rem 0; }
    .row { margin: .2rem 0; }
    .copy { background: var(--shoot); border: 0; border-radius: .6rem; padding: .3rem .6rem; color: var(--forest); cursor: pointer; font-size: 1.05rem; }
    .status { display: flex; gap: .4rem; margin-top: .8rem; flex-wrap: wrap; }
    .status button { min-height: 2.75rem; padding: 0 1rem; border-radius: 999px; border: 2px solid var(--forest); background: transparent; color: var(--forest); cursor: pointer; }
    .status button[aria-pressed="true"] { background: var(--forest); color: var(--oat); }
    .ghost { background: transparent; color: var(--forest); border: 2px solid var(--forest); }
    .empty { padding: 2rem; text-align: center; background: var(--shoot); border-radius: 1.25rem; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>새싹 공방 예약함</h1>

    <form id="login" class="login">
      <label for="pw">관리자 비밀번호</label>
      <input id="pw" type="password" autocomplete="current-password" required>
      <button class="btn" type="submit">들어가기</button>
      <p class="err" id="login-err" role="alert"></p>
    </form>

    <section id="board" hidden>
      <div class="bar">
        <button class="btn ghost" id="refresh" type="button">새로고침</button>
        <button class="btn ghost" id="logout" type="button">나가기</button>
      </div>
      <div class="count"><strong id="new-count">0</strong>건의 새 예약 신청</div>
      <p class="err" id="board-err" role="alert"></p>
      <ul class="list" id="list"></ul>
    </section>
  </div>

  <script>
  (function () {
    const KEY = 'saessak-admin';
    const STATUSES = ['새 문의', '연락함', '완료'];
    const $ = (id) => document.getElementById(id);
    const getPw = () => sessionStorage.getItem(KEY) || '';

    async function call(method, body) {
      const r = await fetch('/api/admin', {
        method,
        headers: { 'x-admin-password': getPw(), ...(body ? { 'Content-Type': 'application/json' } : {}) },
        body: body ? JSON.stringify(body) : undefined,
      });
      const data = await r.json().catch(() => ({}));
      if (r.status === 401) { logout('비밀번호가 맞지 않아요.'); throw new Error(''); }
      if (!r.ok) throw new Error(data.error || '불러오지 못했어요.');
      return data;
    }

    function fmt(iso) {
      const d = new Date(iso);
      return d.toLocaleString('ko-KR', { month: 'long', day: 'numeric', weekday: 'short', hour: '2-digit', minute: '2-digit' });
    }

    function render(rows) {
      $('new-count').textContent = rows.filter((r) => r.status === '새 문의').length;
      const list = $('list');
      list.textContent = '';
      if (!rows.length) {
        const li = document.createElement('li');
        li.className = 'empty';
        li.textContent = '아직 들어온 예약 신청이 없어요.';
        list.appendChild(li);
        return;
      }
      rows.forEach((r) => {
        const li = document.createElement('li');
        li.className = 'card' + (r.status === '새 문의' ? ' new' : '');
        const meta = document.createElement('p'); meta.className = 'meta'; meta.textContent = fmt(r.created_at) + ' 접수';
        const name = document.createElement('p'); name.className = 'name'; name.textContent = r.name;
        const contact = document.createElement('p'); contact.className = 'row';
        const cbtn = document.createElement('button'); cbtn.type = 'button'; cbtn.className = 'copy'; cbtn.textContent = r.contact;
        cbtn.title = '눌러서 복사';
        cbtn.addEventListener('click', async () => {
          try { await navigator.clipboard.writeText(r.contact); cbtn.textContent = '복사했어요'; setTimeout(() => (cbtn.textContent = r.contact), 1200); }
          catch { const s = window.getSelection(); const rg = document.createRange(); rg.selectNodeContents(cbtn); s.removeAllRanges(); s.addRange(rg); }
        });
        contact.append('연락처 ', cbtn);
        const wish = document.createElement('p'); wish.className = 'row'; wish.textContent = '희망 날짜 ' + (r.wish_date || '-');
        const st = document.createElement('div'); st.className = 'status';
        STATUSES.forEach((s) => {
          const b = document.createElement('button'); b.type = 'button'; b.textContent = s;
          b.setAttribute('aria-pressed', String(r.status === s));
          b.addEventListener('click', async () => {
            if (r.status === s) return;
            try { await call('PATCH', { id: r.id, status: s }); load(); } catch (e) { if (e.message) $('board-err').textContent = e.message; }
          });
          st.appendChild(b);
        });
        li.append(meta, name, contact, wish, st);
        list.appendChild(li);
      });
    }

    async function load() {
      $('board-err').textContent = '';
      try { const data = await call('GET'); $('login').hidden = true; $('board').hidden = false; render(data.rows || []); }
      catch (e) { if (e.message) $('board-err').textContent = e.message; }
    }

    function logout(msg) {
      sessionStorage.removeItem(KEY);
      $('board').hidden = true; $('login').hidden = false;
      $('pw').value = ''; $('login-err').textContent = msg || ''; $('pw').focus();
    }

    $('login').addEventListener('submit', (e) => {
      e.preventDefault();
      sessionStorage.setItem(KEY, $('pw').value);
      $('login-err').textContent = '';
      load();
    });
    $('refresh').addEventListener('click', load);
    $('logout').addEventListener('click', () => logout(''));
    if (getPw()) load(); else $('pw').focus();
  })();
  </script>
</body>
</html>
